name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, run unit and integration tests
        run: mvn -B -ntp verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload application JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/course-catalogue.jar
          if-no-files-found: error

  docker:
    name: Build container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download application JAR
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target

      - name: Build image (not pushed)
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t course-catalogue:${{ github.sha }} .
